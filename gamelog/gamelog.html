<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gamelog – Terrivel World</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('tw-theme')==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen&family=VT323&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="../main/estilo.css">
</head>
<body data-page="gamelog" data-root="../">
<div id="bg"></div><canvas id="stars"></canvas>
<header id="topbar"></header>
<main>
<h1>GAMELOG</h1>
<div class="tools"><input id="q" type="search" autocomplete="off"><select id="con"></select><button id="info" type="button" aria-haspopup="dialog" aria-label="Sobre o Gamelog">!</button><select id="hou"></select><span id="count"></span></div>
<div id="list"></div>
<button id="top" class="tb" type="button"></button>
<dialog id="zoom"><img alt=""></dialog>
<dialog id="about"><div><div id="abouttext"></div><button type="button" id="aboutclose">Fechar</button></div></dialog>
</main>
<script src="../main/site.js"></script>
<script>if(typeof TW==='undefined'){document.body.insertAdjacentHTML('beforeend','<p style="font:16px/1.5 sans-serif;max-width:560px;margin:24px auto;padding:16px;border:2px solid #c00;color:#000;background:#fff">Os arquivos da pasta <b>main</b> (estilo.css e site.js) não foram encontrados em <code>../main/</code>. Confira se a pasta <b>main</b> está no repositório, ao lado do index.html, com o nome em letras minúsculas.</p>')}</script>
<script src="gamelog.js"></script>
</body></html>
